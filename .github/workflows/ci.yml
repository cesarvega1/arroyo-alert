name: ARROYO ALERT CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate project directories
        run: |
          test -d frontend
          test -d backend
          test -d ai-service
          test -d infrastructure
          test -d docs
          test -d .github/workflows
          echo "Project directories validated successfully"

      - name: Validate configuration files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .editorconfig
          echo "Configuration files validated successfully"

      - name: Check tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env(\.test)?\.example$'; then
            echo "::error::Environment file must not be tracked"
            exit 1
          fi
          echo "Environment file validation passed"

      - name: Structure validation completed
        run: echo "Project structure validated successfully"

  validate-backend:
    name: Validate backend
    needs: validate-structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.7

        env:
          POSTGRES_DB: arroyo_alert_test
          POSTGRES_USER: arroyo_test
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5435:5432

        options: >-
          --health-cmd="pg_isready -U arroyo_test -d arroyo_alert_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 3001
      API_PREFIX: api/v1
      DB_HOST: 127.0.0.1
      DB_PORT: 5435
      DB_USER: arroyo_test
      DB_PASSWORD: ci_test_password
      DB_NAME: arroyo_alert_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run lint
        run: npm run lint -- --deny-warnings

      - name: Run unit tests
        run: npm run test

      - name: Run database migrations
        run: npm run migration:run:test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

  validate-infrastructure:
    name: Validate infrastructure
    needs: validate-structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Docker Compose
        run: docker compose version

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Infrastructure validation completed
        run: echo "Infrastructure validated successfully"