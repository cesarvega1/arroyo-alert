name: ARROYO ALERT CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate project directories
        run: |
          test -d frontend
          test -d backend
          test -d ai-service
          test -d infrastructure
          test -d docs
          test -d .github/workflows
          echo "Project directories validated successfully"

      - name: Validate configuration files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .editorconfig
          echo "Configuration files validated successfully"

      - name: Check tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::Environment file must not be tracked"
            exit 1
          fi
          echo "Environment file validation passed"

      - name: Structure validation completed
        run: echo "Project structure validated successfully"

  validate-backend:
    name: Validate backend
    needs: validate-structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run lint
        run: npm run lint -- --deny-warnings

      - name: Run unit tests
        run: npm run test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build backend
        run: npm run build

      - name: Backend validation completed
        run: echo "Backend validated successfully"

  validate-infrastructure:
    name: Validate infrastructure
    needs: validate-structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Docker Compose
        run: docker compose version

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Infrastructure validation completed
        run: echo "Infrastructure validated successfully"